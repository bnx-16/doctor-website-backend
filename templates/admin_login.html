<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Dr. Dipika Thorat</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            background: white;
            padding: 35px;
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 5px 25px #00000015;
        }

        h2 {
            text-align: center;
            color: #167d76;
            margin-bottom: 8px;
        }

        p {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 14px 0 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #167d76;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #11665f;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Admin Login</h2>
        <p>Dr. Dipika Thorat Family Physician</p>

        <form action="/admin/login" method="POST">
            <label for="username">Username</label>
            <input id="username" name="username"
                   type="text" required>

            <label for="password">Password</label>
            <input id="password" name="password"
                   type="password" required>

            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
